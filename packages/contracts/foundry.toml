[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules", "lib"]
solc = "0.8.28"                  # dipaksa @gluwa/usc-contracts v0.2.0 — BUKAN 0.8.23
optimizer = true
optimizer_runs = 200

# WAJIB. Overload BATCH `verifyAndEmit` menerima array calldata bersarang
# (uint64[], bytes[], MerkleProof[]) dan menabrak "stack too deep" di codegen
# lama — sudah dibuktikan, bukan dugaan. Batching adalah strategi biaya inti
# Corolary, jadi via_ir tidak opsional di repo ini.
via_ir = true

# `london`, bukan `paris`, dan ini DIPAKSA OLEH CHAIN — bukan pilihan gaya.
#
# Blok CC3 Testnet tidak memuat `mixHash` sama sekali (diperiksa langsung ke
# RPC: field-nya tidak ada, bukan bernilai nol). Pada EVM paris ke atas, revm
# menurunkan `prevrandao` dari field itu, sehingga `forge script --rpc-url
# cc3-testnet` berhenti sebelum menjalankan satu baris pun dengan
# "header validation error: `prevrandao` not set". Menyetel `block_prevrandao`
# di config TIDAK menolong — nilainya tetap diambil dari header fork.
# `london` memakai `difficulty`, yang CC3 memang kembalikan (0x0).
#
# Aman untuk repo ini: tidak ada kontrak yang membaca `block.prevrandao` atau
# `block.difficulty`, dan tidak ada yang memakai PUSH0/MCOPY/TSTORE — jadi
# london justru lebih konservatif tanpa mengubah perilaku.
evm_version = "london"

# Test membaca proof Ethereum mainnet ASLI dari docs/samples — bukan fixture.
fs_permissions = [{ access = "read", path = "../../docs/samples" }]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

# Verifikasi kontrak di explorer CC3 Testnet (Blockscout).
# Blockscout tidak butuh API key sungguhan, tapi Foundry tetap meminta field-nya.
[etherscan]
cc3-testnet = { key = "unused", chain = 102031, url = "https://creditcoin-testnet.blockscout.com/api" }

[rpc_endpoints]
cc3-testnet = "${CREDITCOIN_RPC_URL}"
